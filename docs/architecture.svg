<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
  <title id="architecture-title">How dssr works</title>
  <desc id="architecture-desc">dssr serve pulls records from OAI-PMH data providers on a cron schedule, maps them through a dc field whitelist into its tantivy index, keeps the harvest cursor of each source in state.json beside the index, and answers client services over the HTTP API and the dssr CLI over the admin socket.</desc>
  <defs>
    <style>
      #architecture-root .name { font-family: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #eaf2ff; }
      #architecture-root .sub { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; fill: #a9bfe0; }
      #architecture-root .tag { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 7px; letter-spacing: 0.08em; fill: #8aa4cc; }
      #architecture-root .label { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #a9bfe0; }
      #architecture-root .zone { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 7px; letter-spacing: 0.14em; fill: #8aa4cc; }
    </style>
    <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9bfe0"/></marker>
  </defs>


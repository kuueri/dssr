  <line x1="408" y1="104" x2="456" y2="104" stroke="#a9bfe0" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <path d="M 608,104 H 732 Q 740,104 740,112 V 176" fill="none" stroke="#a9bfe0" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <line x1="176" y1="216" x2="256" y2="216" stroke="#a9bfe0" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

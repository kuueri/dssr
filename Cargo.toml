[package]
name = "dssr"
version = "0.0.10"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "4"
libc = "0.2"
levenshtein_automata = "0.2"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "blocking",
] }
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
subtle = "2"
tantivy = "0.27"
tantivy-fst = "0.5"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "time",
  "sync",
] }
unicode-normalization = "0.1"
unicode-segmentation = "1"

[profile.release]
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

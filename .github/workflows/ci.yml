name: ci
on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/testdata/**"
      - install.sh
      - "scripts/**"
      - internal/server/openapi.json
      - go.mod
      - go.sum
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - "**/*.go"
      - "**/testdata/**"
      - install.sh
      - "scripts/**"
      - internal/server/openapi.json
      - go.mod
      - go.sum
      - .github/workflows/ci.yml
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: shellcheck install.sh scripts/package.sh

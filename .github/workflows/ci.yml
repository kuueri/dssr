name: ci
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "testdata/**"
      - install.sh
      - "scripts/**"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - "src/**"
      - "testdata/**"
      - install.sh
      - "scripts/**"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ci.yml
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: shellcheck install.sh scripts/package.sh

name: release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          [[ ${ref% *} == tag ]] || { echo "::error::$GITHUB_REF_NAME is a lightweight tag. Create it with: git tag -s $GITHUB_REF_NAME -m $GITHUB_REF_NAME"; exit 1; }
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq '.verification.verified')
          [[ $verified == true ]] || { echo "::error::GitHub does not verify the signature of tag $GITHUB_REF_NAME"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
  test:
    uses: ./.github/workflows/ci.yml
  release:
    needs: [verify-tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bash scripts/package.sh "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" dist/dssr_linux_*.tar.gz dist/checksums.txt --title "v$GITHUB_REF_NAME" --notes-file dist/notes.md --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

name: release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bash scripts/package.sh "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" dist/dssr_linux_*.tar.gz dist/checksums.txt --title "v$GITHUB_REF_NAME" --notes-file dist/notes.md --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
